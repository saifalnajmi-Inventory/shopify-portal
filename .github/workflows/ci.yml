name: Build Check

# Runs on every push to main AND on every pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js 22 (same version Railway uses)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install all npm packages (uses lockfile for exact versions)
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma client (required before build)
      - name: Generate Prisma client
        run: npx prisma generate

      # 5. Run Next.js build — this is the main check
      #    If any page, API route, or component has a syntax error → FAILS HERE
      - name: Build Next.js
        run: npm run build
        env:
          # Fake values so the build doesn't crash looking for real secrets
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          SHOPIFY_STORE_DOMAIN: "fake.myshopify.com"
          SHOPIFY_ACCESS_TOKEN: "shpat_fake"
          INTERNAL_SYNC_KEY: "fakesynckey"
          SENTRY_DSN: "https://fake@o0.ingest.sentry.io/0"
          NEXT_PUBLIC_SENTRY_DSN: "https://fake@o0.ingest.sentry.io/0"
          NEXT_PUBLIC_APP_NAME: "Inventory Portal"
          # Tell Sentry not to actually connect during CI build
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARN: "1"
